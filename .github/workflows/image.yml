# The core's image on GitHub's container registry: ghcr.io/<owner>/kedalio-core (core/image/Dockerfile), linux/amd64
# and linux/arm64. Not a gate: scripts/ci.sh is the gate.
#
# Two ways in, one build:
#   - ci.yml calls this file (`workflow_call`) in a job that needs the gate, on a push to `dev`: no image of a commit
#     exists before the gate passed on it. Tags :dev and :sha-<short>.
#   - a push of a tag v<X.Y.Z> (see release.yml, which tests it): tags :X.Y.Z, :X.Y and :latest (a prerelease,
#     v1.0.0-rc.1, gets only its own tag, so :latest stays a release).
# A call from a ref that is neither pushes nothing (the check in «tags»).
#
# The first push creates the package private: make it public once (the repository's Packages › kedalio-core ›
# Package settings › Change visibility), see docs/ci.md. Uses the job's GITHUB_TOKEN only, no secret.
name: image
on:
  workflow_call:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the whole history and its tags: a dev build's version is `git describe` of the commit
          fetch-depth: 0

      # The image name must be lower case; the owner's login may not be.
      - name: tags
        id: tags
        env:
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${OWNER,,}/kedalio-core"
          if [[ "$REF" == refs/heads/dev ]]; then
            # <last release>-<commits since>-g<sha>, e.g. 1.0.0-2-g27fd585, the v stripped; with no release tag
            # reachable (a fork, a shallow history) 0.0.0-<sha7>, which still sorts below every release
            if described=$(git describe --tags --match 'v[0-9]*' --long 2>/dev/null); then
              version="${described#v}"
            else
              version="0.0.0-${GITHUB_SHA::7}"
            fi
            tags="$image:dev,$image:sha-${GITHUB_SHA::7}"
          elif [[ "$REF" == refs/tags/v* ]]; then
            version="${REF_NAME#v}"
            if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::$REF_NAME is not a version tag (vX.Y.Z or vX.Y.Z-pre)"
              exit 1
            fi
            tags="$image:$version"
            [[ -n "${BASH_REMATCH[3]}" ]] || tags="$tags,$image:${BASH_REMATCH[1]}.${BASH_REMATCH[2]},$image:latest"
          else
            echo "$REF is neither dev nor a version tag: nothing is pushed"
            echo "push=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "push=true"
            echo "version=$version"
            echo "tags=$tags"
          } >>"$GITHUB_OUTPUT"

      # A tag is not gated by ci.yml: its tests run here, so a tag with failing tests publishes no image (a `dev` call
      # comes after the gate).
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          go-version-file: go.mod
      - name: test
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: go test ./...

      # QEMU only runs the runtime stage's `apk add` for the other architecture: the Go build cross-compiles.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: ${{ steps.tags.outputs.push == 'true' }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: ${{ steps.tags.outputs.push == 'true' }}

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: ${{ steps.tags.outputs.push == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: ${{ steps.tags.outputs.push == 'true' }}
        with:
          context: .
          file: core/image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.title=kedalio-core
            org.opencontainers.image.description=Kedalio core: memory, tasks and projects behind one MCP connector
          cache-from: type=gha
          cache-to: type=gha,mode=max
