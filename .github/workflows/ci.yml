# CI on GitHub Actions: the gate is scripts/ci.sh, nothing else (a new check goes there, not here). docs/ci.md says
# what each workflow does.
#
# The gate needs Go (the version go.mod names), Deno, shellcheck and gitleaks (required in CI). Deno and Go come from
# their setup actions; shellcheck and gitleaks are release tarballs, sha256-checked. Actions are pinned by commit SHA
# (the version in the comment; Dependabot moves both).
#
# It does not skip a commit whose tree already passed: GitHub shows the check on the commit itself, and a green run
# of the same tree is cheap enough to repeat.
name: ci
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # a newer push must not cancel the image push or deploy of `dev` half way
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

permissions:
  contents: read

env:
  CI: "true"
  DENO_VERSION: 2.9.7
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  SHELLCHECK_VERSION: 0.10.0
  SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the history of the commit under test, commits.ts reads it since the last tag
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}

      # Go: the version go.mod names; setup-go caches the module and build caches under the go.sum key.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: tools
        run: |
          fetch() { # <url> <sha256> <file>
            curl -fsSL -o "$3" "$1"
            echo "$2  $3" | sha256sum -c -
          }
          fetch "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tgz"
          sudo tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C /usr/local/bin gitleaks
          fetch "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            "$SHELLCHECK_SHA256" "$RUNNER_TEMP/shellcheck.txz"
          sudo tar -xJf "$RUNNER_TEMP/shellcheck.txz" -C /usr/local/bin --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"

      - name: gate
        run: bash scripts/ci.sh

  # The image of a green `dev` (image.yml, pushed to ghcr.io), then the owner's redeploy (deploy.yml, which does nothing
  # without its secrets). A newer push cancels a run of any other branch, never one of `dev` (concurrency above).
  image:
    needs: gate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write

  deploy:
    needs: image
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    uses: ./.github/workflows/deploy.yml
    permissions: {}
