version: 2
updates:
  # Actions are pinned by commit SHA with the version in a comment; Dependabot moves both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
  - package-ecosystem: docker
    directory: /core/image
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
  - package-ecosystem: docker-compose
    directory: /deploy/coolify
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
